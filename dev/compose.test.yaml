services:
  postgres:
    image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
    environment:
      POSTGRES_DB: knowledge_e2e
      POSTGRES_USER: knowledge_e2e
      POSTGRES_PASSWORD: e2e-only-password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U knowledge_e2e -d knowledge_e2e]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: frontend/e2e/environment/backend/Dockerfile
    environment:
      APP_ENV: test
      E2E_RUN_ID: ${E2E_RUN_ID:?E2E_RUN_ID is required}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://knowledge_e2e:e2e-only-password@postgres:5432/knowledge_e2e?sslmode=disable
      APP_ORIGIN: https://app.knowledge.test
      PREVIEW_ORIGIN: https://preview.knowledge.test
      S3_ENDPOINT: minio:9000
      S3_BUCKET: knowledge-private
      S3_ACCESS_KEY: e2e-access-key
      S3_SECRET_KEY: e2e-secret-key
      S3_INSECURE: "true"
      E2E_MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3
    command: [server, /data, --address, ":9000"]
    environment:
      MINIO_ROOT_USER: e2e-access-key
      MINIO_ROOT_PASSWORD: e2e-secret-key
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: frontend/e2e/environment/frontend/Dockerfile

  certificates:
    build:
      context: .
      dockerfile: frontend/e2e/environment/proxy/Dockerfile
    entrypoint: [sh, /usr/local/bin/certificates.sh]
    volumes:
      - certificates:/certs
    profiles: [commands]

  oauth:
    build:
      context: .
      dockerfile: frontend/e2e/environment/init/Dockerfile.tools
    command: [node, oauth/server.mjs]

  proxy:
    build:
      context: .
      dockerfile: frontend/e2e/environment/proxy/Dockerfile
    volumes:
      - certificates:/certs:ro
    networks:
      default:
        aliases:
          [app.knowledge.test, preview.knowledge.test, oauth.knowledge.test]
    depends_on: [backend, frontend, oauth]

  init:
    build:
      context: .
      dockerfile: frontend/e2e/environment/init/Dockerfile.tools
    environment:
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes:
      - certificates:/certs:ro
    profiles: [commands]

  test:
    build:
      context: .
      dockerfile: frontend/e2e/environment/runner/Dockerfile
    volumes:
      - certificates:/certs:ro
      - artifacts:/artifacts
    profiles: [commands]

volumes:
  postgres-data:
  minio-data:
  certificates:
  artifacts:
