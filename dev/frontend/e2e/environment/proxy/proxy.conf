server {
    listen 443 ssl;
    server_name app.knowledge.test;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    client_max_body_size 65m;
    # readyはAPIのルート、v1は/apiを保持してバックエンドへ転送する。
    location = /api/ready {
        proxy_set_header Host $host;
        proxy_pass http://backend:8080/ready;
    }
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8080;
    }
    location / { proxy_pass http://frontend:80; }
}
server {
    listen 443 ssl;
    server_name oauth.knowledge.test;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    location / { proxy_pass http://oauth:80; }
}
server {
    listen 443 ssl;
    server_name preview.knowledge.test;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8080;
    }
}
