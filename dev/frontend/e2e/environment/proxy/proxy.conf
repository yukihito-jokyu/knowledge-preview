server {
    listen 443 ssl;
    server_name app.knowledge.test;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    location /api/ { proxy_pass http://backend:8080/; }
    location / { proxy_pass http://frontend:80; }
}
server {
    listen 443 ssl;
    server_name oauth.knowledge.test;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    location / { proxy_pass http://oauth:80; }
}
server {
    listen 443 ssl;
    server_name preview.knowledge.test;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    add_header Content-Security-Policy "default-src 'none'; script-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://app.knowledge.test" always;
    add_header X-Content-Type-Options nosniff always;
    location / { default_type application/json; return 501 '{"error":{"code":"not_implemented","message":"Public file delivery is not implemented"}}'; }
}
