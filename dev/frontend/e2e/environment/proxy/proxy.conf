limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name app.knowledge.test;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    client_max_body_size 65m;
    # readyはAPIのルート、v1は/apiを保持してバックエンドへ転送する。
    location = /api/ready {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8080/ready;
    }
    location = /api/v1/auth/github/start {
        limit_req zone=auth_per_ip burst=9 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8080;
    }
    location = /api/v1/auth/github/callback {
        limit_req zone=auth_per_ip burst=9 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8080;
    }
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8080;
    }
    location / {
        proxy_buffering off;
        proxy_pass http://frontend:80;
    }
}
server {
    listen 443 ssl;
    server_name oauth.knowledge.test;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    location / { proxy_pass http://oauth:80; }
}
server {
    listen 443 ssl;
    server_name preview.knowledge.test;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8080;
    }
}
